services:
  traefik:
    image: traefik:3.7.13
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    command:
      --api.insecure=false 
      --api.dashboard=false
      --providers.docker=true
      
      --entrypoints.web.address=:80
      --entrypoints.websecure.address=:443
      --entrypoints.mqttsecure.address=:8883
      
      --certificatesresolvers.myresolver.acme.tlschallenge=false
      --certificatesresolvers.myresolver.acme.httpchallenge=true
      --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      --certificatesresolvers.myresolver.acme.email=Marc.Golder@hs-heilbronn.de
      --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json

      --entrypoints.web.http.redirections.entrypoint.to=websecure
      --entrypoints.web.http.redirections.entrypoint.scheme=https
    
      --log.level=INFO
      --ping=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      -
      # Shared rate limit middleware (referenced by routers in other compose files)
      - "traefik.http.middlewares.ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.ratelimit.ratelimit.burst=200"
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 1m
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  frontend:

