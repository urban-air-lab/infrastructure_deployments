---
global:
  scrape_interval: 15s  # By default, scrape targets every 15 seconds.


alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yaml


scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['91.99.65.22:9100']
        labels:
          server: "vm1"
      - targets: ["142.132.170.152:9100"]
        labels:
          server: "vm2"


  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
     - targets: ['91.99.65.22:8080']
       labels:
         server: "vm1"
     - targets: ["142.132.170.152:8080"]
       labels:
         server: "vm2"