services:
  lubw-client:
    image: ghcr.io/urban-air-lab/lubw_client:2be5cc8a1f50427fd0b26e1bcf6a20ed4f55801d
    container_name: lubw-client
    restart: always
    environment:
      - LUBW_USERNAME=${LUBW_USERNAME}
      - LUBW_PASSWORD=${LUBW_PASSWORD}
      - LUBW_BASE_URL=${LUBW_BASE_URL}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_SERVER=${MQTT_SERVER}
      - MQTT_PORT=${MQTT_PORT}
    networks:
      - iot
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    restart: always
    networks:
      - iot
      - frontend
    volumes:
      - ${CONFIG_ROOT}/configs/mosquitto:/mosquitto/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ual_infrastructure_deployments_frontend"

      # TCP router for MQTT over TLS
      - "traefik.tcp.routers.mqtt.rule=HostSNI(`mqtt.${TRAEFIK_DOMAIN}`)"
      - "traefik.tcp.routers.mqtt.entrypoints=mqttsecure"
      - "traefik.tcp.services.mqtt.loadbalancer.server.port=8883"
      - "traefik.tcp.routers.mqtt.tls.certresolver=myresolver"
      - "traefik.http.routers.mqtt.middlewares=ratelimit"
    healthcheck:
      test: [ "CMD-SHELL", "grep -q mosquitto /proc/*/comm 2>/dev/null || exit 1" ]
      interval: 1m
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: always
    networks:
      - iot
      - frontend
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./scripts/init-influx.sh:/docker-entrypoint-initdb.d/init-influx.sh
    environment:
      - INFLUXD_PPROF_DISABLED=true
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=urban-air-lab
      - DOCKER_INFLUXDB_INIT_BUCKET=test-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ual_infrastructure_deployments_frontend"

      - "traefik.http.routers.influx-secure.rule=Host(`influx.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.influx-secure.entrypoints=websecure"
      - "traefik.http.routers.influx-secure.tls=true"
      - "traefik.http.routers.influx-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.influx-secure.middlewares=ratelimit,hsts"

      # HSTS header middleware
      - "traefik.http.middlewares.hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts.headers.forceSTSHeader=true"
    healthcheck:
          test: ["CMD", "curl", "influxdb:8086/ping"]
          interval: 1m
          timeout: 10s
          retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  telegraf:
    image: telegraf:1.40.0
    container_name: telegraf
    hostname: telegraf
    restart: always
    networks:
      - iot
      - frontend
    volumes:
      - ${CONFIG_ROOT}/configs/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q telegraf /proc/*/comm 2>/dev/null || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  iot:
  frontend:

volumes:
  influxdb-data:
  influxdb-config: