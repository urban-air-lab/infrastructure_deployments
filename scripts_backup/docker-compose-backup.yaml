services:
  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: always
    ports:
      - "8086:8086"
    networks:
      - backup
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./scripts/init-influx.sh:/docker-entrypoint-initdb.d/init-influx.sh
    environment:
      - INFLUXD_PPROF_DISABLED=true
networks:
  backup:

volumes:
  influxdb-data:
    name: scripts_backup_influxdb-data
  influxdb-config: