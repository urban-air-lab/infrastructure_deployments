services:
    rustfs:
        restart: always
        image: rustfs/rustfs:1.0.0
        container_name: mlflow_s3
        environment:
          - RUSTFS_VOLUMES=/data
          - RUSTFS_ADDRESS=0.0.0.0:9000
          - RUSTFS_CONSOLE_ENABLE=false
          - RUSTFS_ACCESS_KEY=${AWS_ACCESS_KEY_ID}
          - RUSTFS_SECRET_KEY=${AWS_SECRET_ACCESS_KEY}
        volumes:
            - minio_data:/data
        networks:
            - ml
        healthcheck:
            test: ["CMD", "curl", "localhost:9000"]
            interval: 1m
            timeout: 10s
            retries: 5
        logging:
          driver: "json-file"
          options:
            max-size: "100m"
            max-file: "5"

    db:
        restart: always
        image: mysql:8.4.11
        container_name: mlflow_db
        command: --log-bin-trust-function-creators=1
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - ml
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        logging:
          driver: "json-file"
          options:
            max-size: "100m"
            max-file: "5"

    web:
        restart: always
        build: ./docker/mlflow-docker
        image: mlflow_server
        container_name: mlflow_server
        ports:
          - "5000:5000"
        depends_on:
            db:
                condition: service_healthy
            rustfs:
                condition: service_healthy
        environment:
            - MLFLOW_S3_ENDPOINT_URL=http://rustfs:9000
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - MLFLOW_FLASK_SERVER_SECRET_KEY=${MLFLOW_FLASK_SERVER_SECRET_KEY}
            - MLFLOW_AUTH_CONFIG_PATH=/mlflow/credentials
            - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false
        volumes:
            - ${CONFIG_ROOT}/configs/mlflow/credentials:/mlflow/credentials
        command: mlflow server --backend-store-uri mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE} --artifacts-destination s3://mlflow/ --host 0.0.0.0 --allowed-hosts "mlflow.urbanairlab.hn,*.urbanairlab.hn,localhost:5000" --cors-allowed-origins "https://mlflow.urbanairlab.hn,http://localhost:5000" --app-name=basic-auth --workers 1
        networks:
            - ml
            - frontend
        labels:
          - "traefik.enable=true"
          - "traefik.docker.network=ual_infrastructure_deployments_frontend"

          - "traefik.http.routers.mlflow-secure.rule=Host(`mlflow.${TRAEFIK_DOMAIN}`)"
          - "traefik.http.routers.mlflow-secure.entrypoints=websecure"
          - "traefik.http.routers.mlflow-secure.tls=true"
          - "traefik.http.routers.mlflow-secure.tls.certresolver=myresolver"

          - "traefik.http.routers.mlflow-secure.middlewares=ratelimit,hsts"

          # HSTS header middleware
          - "traefik.http.middlewares.hsts.headers.stsSeconds=31536000"
          - "traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true"
          - "traefik.http.middlewares.hsts.headers.forceSTSHeader=true"
        healthcheck:
            test: [ "CMD", "curl", "http://localhost:5000/health" ]
            interval: 1m
            timeout: 10s
            retries: 5
        logging:
          driver: "json-file"
          options:
            max-size: "100m"
            max-file: "5"

networks:
  ml:
  frontend:

volumes:
    dbdata:
    minio_data:
